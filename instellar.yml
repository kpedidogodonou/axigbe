dependencies:
  build:
    - elixir
    - npm
    - gcc
    - make 
    - erlang-dev
  runtime:
    - bash
    - curl
    - s6
    - jq
    - ca-certificates
    - axigbe-openrc
  trace: true

stack: alpine/3.19

run:
  commands:
    - binary: axigbe
      call: eval 'Axigbe.Release.Tasks.migrate'
      name: migrate
    - binary: axigbe
      call: remote
      name: console
    - binary: tail
      call: -f -n 100 /var/log/axigbe/current
      name: logs
      path: /usr/bin
  name: axigbe
  services:
    - binary: axigbe
      name: web
      start:
        call: start

hook:
  post-deinstall: |
    rc-service axigbe stop
    rc-update del axigbe
  post-install: |
    rc-update add axigbe
    rc-service axigbe migrate
  post-upgrade: |
    rc-service axigbe migrate
    rc-service axigbe start
  pre-upgrade: |
    rc-service axigbe stop

build:
  command: |
    export MIX_ENV=prod

    mix local.hex --force
    mix local.rebar --force
    mix do deps.get --only prod

    # npm --prefix ./assets install ./assets

    # Comment out mix assets.deploy for non phoenix apps
    mix assets.deploy

    mix release
  destinations:
    - _build/prod/rel/axigbe/*

kits:
  - description: Web service
    main: true
    name: web
    ports:
      - main: true
        name: web
        target: 4000
    variables:
      - default_value: 'true'
        key: PHX_SERVER
      - driver: generic/secret
        driver_options:
          length: 128
        key: SECRET_KEY_BASE
      - default_value: ecto:///
        driver: database/postgresql
        key: DATABASE
      - driver: bucket/aws-s3
        driver_options:
          acl: public
        key: AWS_S3
